<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} - Details</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 60px 20px; text-align: center; }
        .container { max-width: 650px; margin: 0 auto; text-align: left; background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a1a1a; margin-top: 0; margin-bottom: 15px; font-size: 32px; font-weight: 700; }
        .price { font-size: 28px; font-weight: 700; color: #0d6efd; margin-bottom: 20px; }
        .desc-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 4px solid #0d6efd; margin-bottom: 25px; line-height: 1.6; color: #495057; }
        .badge { display: inline-block; padding: 6px 12px; font-size: 14px; font-weight: bold; border-radius: 6px; text-transform: uppercase; margin-bottom: 25px; }
        .badge-in-stock { background-color: #d1e7dd; color: #0f5132; }
        .badge-out-stock { background-color: #f8d7da; color: #842029; }
        .action-btn { background-color: #212529; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
        .action-btn:hover { background-color: #000; }
        .back-link { display: inline-block; margin-bottom: 25px; color: #0d6efd; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'product_list' %}" class="back-link">← Back to Storefront</a>
        <h1>{{ product.name }}</h1>
        <div class="price">${{ product.price }}</div>
        
        <div class="desc-box">
            <strong>Product Description:</strong><br>
            {{ product.description|default:"No detailed description available for this item." }}
        </div>

        {% if product.stock > 0 %}
            <span class="badge badge-in-stock">Available Units: {{ product.stock }}</span>
            <button class="action-btn">Proceed to Purchase</button>
        {% else %}
            <span class="badge badge-out-stock">Out of Stock</span>
            <button class="action-btn" disabled style="background-color: #6c757d; cursor: not-allowed;">Unavailable</button>
        {% endif %}
    </div>
</body>
</html>
